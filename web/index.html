<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS/iPadOSのホーム画面アイコン。iPad(152)・iPad Pro(167)・iPhone(180)が
         それぞれ等倍のPNGを選べるように sizes を明示する。
         ?v= は、以前配信していた壊れたPNGがキャッシュに残っている端末に
         取り直させるため(URLが変わらないとiOSは再取得しない)。 -->
    <link rel="apple-touch-icon" sizes="152x152" href="/icon-152.png?v=2" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icon-167.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png?v=2" />
    <meta name="theme-color" content="#184A40" />
    <!-- viewport-fit=cover で、Android/iOSの切り欠き・ジェスチャーバー分の
         safe-area-inset を有効化する(下部タブが被らないように) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Androidのホーム追加でスタンドアロン起動(display:standaloneと合わせて) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- iOS/iPadOSも同様に。manifestのshort_nameを読まない版のiOSがあるので、
         ホーム画面に出る名前もここで明示しておく。 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Landfall" />
    <meta name="description" content="Landfall — 学習記録アプリ。スマートフォン・タブレット・PCで、記録が同期します。" />
    <meta name="color-scheme" content="dark" />
    <link rel="canonical" href="https://landfall-studylog.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Landfall-StudyLog" />
    <meta property="og:title" content="Landfall — Study Log" />
    <meta property="og:description" content="学習記録アプリ。スマートフォン・タブレット・PCで、記録が同期します。" />
    <meta property="og:url" content="https://landfall-studylog.com/" />
    <meta property="og:image" content="https://landfall-studylog.com/favicon.svg" />
    <title>Landfall — Study Log</title>
    <!-- アプリ本体のJSが旧キャッシュ混在で読めない場合にも、Service Workerだけは
         更新して自力復旧できるよう、登録処理をインラインで先に動かす。 -->
    <script>
      (() => {
        const host = window.location.hostname;
        const production =
          host === "landfall-studylog.com" || host.endsWith(".landfall-studylog.pages.dev");
        if (!production || !("serviceWorker" in navigator)) return;

        const hadController = Boolean(navigator.serviceWorker.controller);
        let reloading = false;
        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (reloading || !hadController) return;
          reloading = true;
          window.location.reload();
        });

        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js", { updateViaCache: "none" })
            .then((registration) => {
              const check = () => registration.update().catch(() => {});
              check();
              document.addEventListener("visibilitychange", () => {
                if (document.visibilityState === "visible") check();
              });
            })
            .catch(() => {});
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
