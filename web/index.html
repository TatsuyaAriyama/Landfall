<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS/iPadOSのホーム画面アイコン。iPad(152)・iPad Pro(167)・iPhone(180)が
         それぞれ等倍のPNGを選べるように sizes を明示する。
         ?v= は、以前配信していた壊れたPNGがキャッシュに残っている端末に
         取り直させるため(URLが変わらないとiOSは再取得しない)。 -->
    <link rel="apple-touch-icon" sizes="152x152" href="/icon-152.png?v=2" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icon-167.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png?v=2" />
    <meta name="theme-color" content="#184A40" />
    <!-- viewport-fit=cover で、Android/iOSの切り欠き・ジェスチャーバー分の
         safe-area-inset を有効化する(下部タブが被らないように) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Androidのホーム追加でスタンドアロン起動(display:standaloneと合わせて) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- iOS/iPadOSも同様に。manifestのshort_nameを読まない版のiOSがあるので、
         ホーム画面に出る名前もここで明示しておく。 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Aftide" />
    <meta name="description" content="Aftide — 学習記録アプリ。スマートフォン・タブレット・PCで、記録が同期します。" />
    <meta name="color-scheme" content="dark" />
    <link rel="canonical" href="https://aftide.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aftide" />
    <meta property="og:title" content="Aftide — Study Log" />
    <meta property="og:description" content="学習記録アプリ。スマートフォン・タブレット・PCで、記録が同期します。" />
    <meta property="og:url" content="https://aftide.app/" />
    <meta property="og:image" content="https://aftide.app/favicon.svg" />
    <title>Aftide — Study Log</title>
    <!-- Service Workerは更新時の新旧JS混在を繰り返したため廃止した。
         既存端末に登録が残っている場合だけ、終了専用Workerへ差し替えて
         キャッシュ削除・登録解除・ネットワーク版への再読込を行う。 -->
    <script>
      (() => {
        const host = window.location.hostname;
        const production =
          host === "aftide.app" ||
          host === "www.aftide.app" ||
          host === "landfall-studylog.com" ||
          host.endsWith(".landfall-studylog.pages.dev");
        if (!production || !("serviceWorker" in navigator)) return;

        navigator.serviceWorker
          .getRegistration()
          .then((registration) => {
            if (!registration) return;
            return navigator.serviceWorker.register("/sw-retire.js?v=1", {
              scope: "/",
              updateViaCache: "none",
            });
          })
          .catch(() => {});
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
